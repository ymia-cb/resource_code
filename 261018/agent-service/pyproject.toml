[project]
name = "ecommerce-agent"
version = "0.1.0"
description = "电商智能客服 Agent（竖切片）"
requires-python = ">=3.11"

dependencies = [
    "langgraph==1.2.16",
    "langgraph-checkpoint-sqlite==3.1.2",
    "langchain-core==1.6.12",
    "pydantic==2.13.5",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "alembic>=1.13",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pymilvus>=3.0.2",
    "minio>=7.2.20",
    "python-multipart>=0.0.9",
    "redis>=5.0",
    "sse-starlette>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
